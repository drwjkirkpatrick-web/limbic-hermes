[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limbic-hermes"
version = "0.1.0"
description = "A neuro-inspired limbic system module for Hermes agents, tunable by remedy personality."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Walker Kirkpatrick"},
]
keywords = ["hermes", "agent", "limbic", "emotion", "affect", "remedy", "personality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
limbic-demo = "limbic_hermes.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["limbic_hermes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
